<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 640" role="img" aria-labelledby="title desc">
  <title id="title">The six-step loop: Listen, Research, Strategize, Execute, Evaluate, Growth</title>
  <desc id="desc">A loop, not a ladder. Listen, Research, and Strategize come first. Execute and Evaluate the path. Growth turns the volume up, then you listen again.</desc>
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#3b6ef5"/>
      <stop offset="100%" stop-color="#3ec8d0"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="640" rx="24" fill="#0c121f"/>
  <circle cx="1080" cy="0" r="300" fill="#3b6ef5" opacity="0.16"/>
  <text x="56" y="58" fill="#7ee0ea" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="800" letter-spacing="2.4">THE ORDER OF THE WORK</text>
  <text x="56" y="98" fill="#fff" font-family="Inter, system-ui, sans-serif" font-size="28" font-weight="800">A loop, not a ladder. Don&apos;t skip the order.</text>

  <g font-family="Inter, system-ui, sans-serif">
    <!-- row 1 -->
    <g>
      <rect x="56" y="140" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="100" cy="184" r="22" fill="url(#g)"/>
      <text x="100" y="191" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">1</text>
      <text x="136" y="190" fill="#fff" font-size="22" font-weight="800">Listen</text>
      <text x="80" y="236" fill="#b7c0d4" font-size="15">Hear the job that isn&apos;t getting</text>
      <text x="80" y="258" fill="#b7c0d4" font-size="15">done. Write it back in their words.</text>
    </g>
    <g>
      <rect x="430" y="140" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="474" cy="184" r="22" fill="url(#g)"/>
      <text x="474" y="191" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">2</text>
      <text x="510" y="190" fill="#fff" font-size="22" font-weight="800">Research</text>
      <text x="454" y="236" fill="#b7c0d4" font-size="15">Study the site, the emails, the ads.</text>
      <text x="454" y="258" fill="#b7c0d4" font-size="15">Keep facts separate from hope.</text>
    </g>
    <g>
      <rect x="804" y="140" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="848" cy="184" r="22" fill="url(#g)"/>
      <text x="848" y="191" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">3</text>
      <text x="884" y="190" fill="#fff" font-size="22" font-weight="800">Strategize</text>
      <text x="828" y="236" fill="#b7c0d4" font-size="15">Pick one path for this season.</text>
      <text x="828" y="258" fill="#b7c0d4" font-size="15">Say what you will not do.</text>
    </g>

    <!-- row 2, reverse direction visually -->
    <g>
      <rect x="804" y="340" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="848" cy="384" r="22" fill="url(#g)"/>
      <text x="848" y="391" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">4</text>
      <text x="884" y="390" fill="#fff" font-size="22" font-weight="800">Execute</text>
      <text x="828" y="436" fill="#b7c0d4" font-size="15">Ship the page, the offer, the</text>
      <text x="828" y="458" fill="#b7c0d4" font-size="15">follow-up, and the ads that match.</text>
    </g>
    <g>
      <rect x="430" y="340" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="474" cy="384" r="22" fill="url(#g)"/>
      <text x="474" y="391" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">5</text>
      <text x="510" y="390" fill="#fff" font-size="22" font-weight="800">Evaluate</text>
      <text x="454" y="436" fill="#b7c0d4" font-size="15">Did people take the next step?</text>
      <text x="454" y="458" fill="#b7c0d4" font-size="15">If not, where did they stop?</text>
    </g>
    <g>
      <rect x="56" y="340" width="340" height="150" rx="16" fill="#151c2b" stroke="#2a3348"/>
      <circle cx="100" cy="384" r="22" fill="url(#g)"/>
      <text x="100" y="391" text-anchor="middle" fill="#fff" font-size="16" font-weight="800">6</text>
      <text x="136" y="390" fill="#fff" font-size="22" font-weight="800">Growth</text>
      <text x="80" y="436" fill="#b7c0d4" font-size="15">Turn the volume up only after</text>
      <text x="80" y="458" fill="#b7c0d4" font-size="15">the path works. Then listen again.</text>
    </g>

    <!-- flow arrows -->
    <polygon points="406,215 430,205 430,225" fill="#3ec8d0"/>
    <polygon points="780,215 804,205 804,225" fill="#3ec8d0"/>
    <!-- down from 3 to 4 -->
    <path d="M974 290 v40" stroke="#3ec8d0" stroke-width="3" fill="none"/>
    <polygon points="964,330 974,350 984,330" fill="#3ec8d0"/>
    <polygon points="804,415 780,405 780,425" fill="#3ec8d0"/>
    <polygon points="430,415 406,405 406,425" fill="#3ec8d0"/>
    <!-- loop back from 6 to 1 -->
    <path d="M80 490 v40 h1040 v-80" stroke="#3ec8d0" stroke-width="3" fill="none" stroke-linejoin="round"/>
    <polygon points="1108,438 1120,450 1132,438" fill="#3ec8d0"/>
    <text x="600" y="552" text-anchor="middle" fill="#7ee0ea" font-size="14" font-weight="800" letter-spacing="1.6">LISTEN AGAIN — GROWTH IS A LOOP</text>
  </g>
</svg>
